{% extends 'base.html' %}{% block content %}
<h1>Ventas</h1>
<section class="form-card">
  <h2>Registrar venta</h2>
  <form method="post">
    <label
      >Cliente<select name="cliente_id" required>
        {% for c in clientes %}
        <option value="{{ c['id'] }}">{{ c['nombre'] }}</option>
        {% endfor %}
      </select></label
    ><label
      >Importe (S/)<input
        name="monto"
        type="number"
        min="0.01"
        step="0.01"
        required /></label
    ><label
      >Fecha<input
        name="fecha"
        type="date"
        value="{{ today }}"
        required /></label
    ><label
      >Campaña<select name="campana">
        {% for c in campanas %}
        <option>{{ c }}</option>
        {% endfor %}
      </select></label
    ><button>Guardar venta</button>
  </form>
</section>
<h2>Historial</h2>
<div class="table-wrap">
  <table>
    <tr>
      <th>Fecha</th>
      <th>Cliente</th>
      <th>Importe</th>
      <th>Campaña</th>
    </tr>
    {% for v in ventas %}
    <tr>
      <td>{{ v['fecha'] }}</td>
      <td>{{ v['nombre'] }}</td>
      <td>S/ {{ '%.2f'|format(v['monto']) }}</td>
      <td>{{ v['campana_asociada'] }}</td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
