{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><p class="eyebrow">CLIENTES / EDITAR</p><h1>Ficha de cliente</h1><p class="muted">Actualiza la información sin perder visitas, ventas ni promociones.</p></div><a class="text-link" href="/clientes">Volver al directorio</a></div>
<section class="form-card narrow"><form method="post" class="form-grid"><label>Nombre completo<input name="nombre" required minlength="2" maxlength="100" value="{{ cliente['nombre'] }}"></label><label>Teléfono con código de país<input name="telefono" type="tel" required minlength="8" maxlength="20" value="{{ cliente['telefono'] }}"></label><label>Categoría<select name="tipo_cliente">{% for t in tipos %}<option value="{{ t }}" {% if cliente['tipo_cliente'] == t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></label><div class="form-actions"><button>Guardar cambios</button><a class="button-link button-secondary" href="/clientes">Cancelar</a></div></form></section>{% endblock %}
