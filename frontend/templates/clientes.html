{% extends 'base.html' %}{% block content %}
<h1>Clientes</h1>
<form class="inline" method="get">
  <label
    >Filtrar por categoría<select name="tipo">
      <option value="">Todos</option>
      {% for t in tipos %}
      <option {% if tipo="" ="t" %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select></label
  ><button>Filtrar</button>
</form>
<div class="table-wrap">
  <table>
    <tr>
      <th>Nombre</th>
      <th>Teléfono</th>
      <th>Tipo</th>
      <th>Última visita</th>
      <th>WhatsApp</th>
    </tr>
    {% for c in clientes %}
    <tr>
      <td>{{ c['nombre'] }}</td>
      <td>{{ c['telefono'] }}</td>
      <td>{{ c['tipo_cliente'] }}</td>
      <td>{{ c['ultima_visita'] or '—' }}</td>
      <td>
        <a
          target="_blank"
          rel="noopener"
          href="https://wa.me/{{ c['telefono']|replace('+','')|replace(' ','') }}"
          >Abrir chat</a
        >
      </td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
