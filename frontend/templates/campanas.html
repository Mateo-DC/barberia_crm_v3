{% extends 'base.html' %}{% block content %}
<div class="page-heading">
  <div>
    <p class="eyebrow">MENSAJERÍA</p>
    <h1>Campañas de WhatsApp</h1>
    <p class="muted">
      Prepara mensajes personalizados. WhatsApp requiere confirmar cada envío y
      adjuntar las imágenes manualmente.
    </p>
  </div>
</div>
<section class="form-card">
  <form method="post" enctype="multipart/form-data">
    <label
      >Modo de audiencia<select name="tipo">
        <option>Todos</option>
        {% for t in tipos %}
        <option>{{ t }}</option>
        {% endfor %}
      </select></label
    ><label
      >Promoción desbloqueada (opcional)<select name="promocion_id">
        <option value="0">Campaña general por categoría</option>
        {% for p in promociones %}
        <option value="{{ p['id'] }}">
          {{ p['nombre'] }} · {{ p['meta_visitas'] }} visitas
        </option>
        {% endfor %}</select
      ><small class="muted"
        >Al elegir una promoción, solo se incluirán clientes que la
        desbloquearon y aún no prepararon su mensaje.</small
      ></label
    ><label
      >Mensaje<textarea
        name="mensaje"
        rows="5"
        placeholder="Déjalo vacío para usar el mensaje de la promoción"
      ></textarea></label
    ><label
      >Imagen de campaña (JPG, PNG o WEBP; máximo 5 MB)<input
        type="file"
        name="imagen"
        accept="image/jpeg,image/png,image/webp" /></label
    ><button>Preparar campaña</button>
  </form>
</section>
{% endblock %}
