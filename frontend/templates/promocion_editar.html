{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><p class="eyebrow">FIDELIZACIÓN / EDITAR</p><h1>Editar promoción</h1><p class="muted">Los cambios de meta, público y conteo se bloquean si ya existen recompensas obtenidas.</p></div><a class="text-link" href="/fidelizacion">Volver</a></div><section class="form-card"><form method="post"><label>Nombre<input name="nombre" required maxlength="100" value="{{ promocion['nombre'] }}"></label><div class="two-fields"><label>Meta de visitas<input name="meta_visitas" required type="number" min="1" max="1000" value="{{ promocion['meta_visitas'] }}"></label><label>Beneficio<input name="premio" value="{{ promocion['premio'] }}"></label></div><label>Descripción<textarea name="descripcion" rows="2">{{ promocion['descripcion'] }}</textarea></label><div class="two-fields"><label>Conteo<select name="modo_conteo"><option value="acumuladas" {% if promocion['modo_conteo'] == 'acumuladas' %}selected{% endif %}>Acumuladas</option><option value="consecutivas" {% if promocion['modo_conteo'] == 'consecutivas' %}selected{% endif %}>Consecutivas</option></select></label><label>Repetición<select name="repeticion"><option value="una_vez" {% if promocion['repeticion'] == 'una_vez' %}selected{% endif %}>Una vez</option><option value="recurrente" {% if promocion['repeticion'] == 'recurrente' %}selected{% endif %}>Recurrente</option></select></label></div><div class="two-fields"><label>Para<select name="tipo_objetivo" id="targetType"><option value="categoria" {% if promocion['tipo_objetivo'] == 'categoria' %}selected{% endif %}>Categoría</option><option value="grupo" {% if promocion['tipo_objetivo'] == 'grupo' %}selected{% endif %}>Grupo</option><option value="todos" {% if promocion['tipo_objetivo'] == 'todos' %}selected{% endif %}>Todos</option></select></label><label>Objetivo<select name="objetivo" id="targetValue"><option value="Todos" {% if promocion['objetivo']=='Todos' %}selected{% endif %}>Todos</option>{% for t in tipos %}<option value="{{ t }}" {% if promocion['objetivo']==t %}selected{% endif %}>{{ t }}</option>{% endfor %}{% for g in grupos %}<option value="{{ g['nombre'] }}" {% if promocion['objetivo']==g['nombre'] %}selected{% endif %}>{{ g['nombre'] }}</option>{% endfor %}</select></label></div><label>Mensaje de WhatsApp<textarea name="mensaje" rows="4" required>{{ promocion['mensaje'] }}</textarea></label><div class="two-fields"><label>Inicio<input name="fecha_inicio" type="date" value="{{ promocion['fecha_inicio'] or '' }}"></label><label>Fin<input name="fecha_fin" type="date" value="{{ promocion['fecha_fin'] or '' }}"></label></div><div class="form-actions"><button>Guardar cambios</button><a class="button-link button-secondary" href="/fidelizacion">Cancelar</a></div></form></section>{% endblock %}
